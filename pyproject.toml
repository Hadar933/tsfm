[project]
name = "tsfm"
version = "0.1.0"
description = "The best Time Series Foundational Model (TSFM) that x$ can buy"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "pandas",
    "numpy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []

[tool.hatch.metadata]
allow-direct-references = true
